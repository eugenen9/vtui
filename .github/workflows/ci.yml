name: CI

on:
  # main only. Work in progress on lunobot/** branches gets the cheap
  # single-job quick.yml; the full matrix runs on pull requests (lunobot
  # trains, urgent fixes, humans) and on main -- one full run per train
  # instead of one per push (LUNOBOT.md § 7.2 in unxed/lunobot). A release
  # tag points at a commit main has already built, so tags stay excluded.
  push:
    branches: ['main']
  pull_request:

# A push fans out into more than forty checks, and only the latest queued run
# for a branch and event is useful. Preserve every main run: its history must
# never be interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each cell is a native OS and architecture pair. Both architectures
        # are required because goffi implements their calling conventions
        # separately.
        include:
          - { os: ubuntu-latest,    target: linux/amd64 }
          - { os: ubuntu-24.04-arm, target: linux/arm64 }
          - { os: macos-latest,     target: darwin/arm64 }
          - { os: macos-15-intel,   target: darwin/amd64 }
          - { os: windows-latest,   target: windows/amd64 }
          - { os: windows-11-arm,   target: windows/arm64 }
    env:
      # vtui is a cgo-free project: every backend reaches libc, X11, Wayland
      # and the GPU through goffi rather than through a C toolchain. Pinning
      # this keeps all six runners on the same configuration instead of
      # letting each one decide by whether it happens to ship a compiler --
      # and it is what keeps bindings/c/cabi, the one cgo package in the
      # tree, out of a build that is not asking for the C bindings.
      CGO_ENABLED: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # proxy.golang.org sometimes drops a module download with a stream
      # error (14-10-2026: Build (solaris/amd64) turned main red on it), which
      # says nothing about the code. Fetch modules with retries up front so the
      # real build or test step only ever sees a warm cache.
      - name: Download modules
        run: for i in 1 2 3 4; do go mod download && exit 0; sleep $((i * 10)); done; exit 1

      - name: Test
        run: go test -count=1 -timeout 4m ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    env:
      # The rest of this workflow intentionally keeps cgo disabled. Enabling
      # it here does not reverse that decision: the race detector requires it.
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # proxy.golang.org sometimes drops a module download with a stream
      # error (14-10-2026: Build (solaris/amd64) turned main red on it), which
      # says nothing about the code. Fetch modules with retries up front so the
      # real build or test step only ever sees a warm cache.
      - name: Download modules
        run: for i in 1 2 3 4; do go mod download && exit 0; sleep $((i * 10)); done; exit 1

      - run: go test -race -count=1 -timeout 15m ./...

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      # go.mod sets the minimum language version, while govulncheck checks the
      # standard library used for the build, so CI needs the latest patch.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          args: --new-from-rev=origin/main

  build:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/amd64
            goos: linux
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: linux/arm64
            goos: linux
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: linux/arm
            goos: linux
            goarch: arm
            tags: ''
            gcflags: ''
          - label: windows/amd64
            goos: windows
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: windows/arm64
            goos: windows
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: darwin/amd64
            goos: darwin
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: darwin/arm64
            goos: darwin
            goarch: arm64
            tags: ''
            gcflags: ''
          # vtui_nococoa swaps the Cocoa backend for its stub.
          - label: darwin/amd64 vtui_nococoa
            goos: darwin
            goarch: amd64
            tags: -tags=vtui_nococoa
            gcflags: ''
          - label: dragonfly/amd64
            goos: dragonfly
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: openbsd/amd64
            goos: openbsd
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: openbsd/arm64
            goos: openbsd
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: netbsd/amd64
            goos: netbsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: netbsd/arm64
            goos: netbsd
            goarch: arm64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: illumos/amd64
            goos: illumos
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: solaris/amd64
            goos: solaris
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: freebsd/amd64
            goos: freebsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: freebsd/arm64
            goos: freebsd
            goarch: arm64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: linux/386 noffi
            goos: linux
            goarch: '386'
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mips noffi
            goos: linux
            goarch: mips
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mipsle noffi
            goos: linux
            goarch: mipsle
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mips64 noffi
            goos: linux
            goarch: mips64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mips64le noffi
            goos: linux
            goarch: mips64le
            tags: -tags=noffi
            gcflags: ''
          - label: linux/riscv64 noffi
            goos: linux
            goarch: riscv64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/loong64 noffi
            goos: linux
            goarch: loong64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/ppc64 noffi
            goos: linux
            goarch: ppc64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/ppc64le noffi
            goos: linux
            goarch: ppc64le
            tags: -tags=noffi
            gcflags: ''
          # f4's lite build keeps only the X11, Wayland and Win32 backends:
          # vtui_noebiten and vtui_nogogpu swap the other two for their stubs.
          - label: linux/amd64 vtui_noebiten,vtui_nogogpu
            goos: linux
            goarch: amd64
            tags: -tags=vtui_noebiten,vtui_nogogpu
            gcflags: ''
          - label: windows/amd64 vtui_noebiten,vtui_nogogpu
            goos: windows
            goarch: amd64
            tags: -tags=vtui_noebiten,vtui_nogogpu
            gcflags: ''
          - label: darwin/arm64 vtui_noebiten,vtui_nogogpu
            goos: darwin
            goarch: arm64
            tags: -tags=vtui_noebiten,vtui_nogogpu
            gcflags: ''
          - label: linux/amd64 goffi_musl
            goos: linux
            goarch: amd64
            tags: -tags=goffi_musl
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std
          - label: linux/arm64 goffi_musl
            goos: linux
            goarch: arm64
            tags: -tags=goffi_musl
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # proxy.golang.org sometimes drops a module download with a stream
      # error (14-10-2026: Build (solaris/amd64) turned main red on it), which
      # says nothing about the code. Fetch modules with retries up front so the
      # real build or test step only ever sees a warm cache.
      - name: Download modules
        run: for i in 1 2 3 4; do go mod download && exit 0; sleep $((i * 10)); done; exit 1

      # These tags and compiler flags come from f4, not from configurations
      # vtui selects itself. f4 builds vtui statically, against musl, and with
      # stubs instead of goffi where purego does not implement the calling
      # convention, so CI exercises the exact downstream configurations.
      - name: Build
        run: go build ${{ matrix.tags }} ${{ matrix.gcflags }} ./...

  vet:
    name: Vet (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/amd64
            goos: linux
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          # unsafeptr runs on both Windows rows too. An address Windows
          # returns as a uintptr (GlobalLock's view of an HGLOBAL) becomes a
          # pointer only through winPtr in win32_ptr_windows.go, and COM
          # callbacks take their arguments typed, so any other
          # unsafe.Pointer(uintptr) is a finding.
          - label: windows/amd64
            goos: windows
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: linux/arm goffi_static
            goos: linux
            goarch: arm
            tags: -tags=goffi_static
            gcflags: ''
            vetflags: ''
          # The Cocoa backend is arm64 and amd64 code alike, and the FFI
          # layer lays out calls for the two separately.
          - label: darwin/amd64
            goos: darwin
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: darwin/arm64 vtui_nococoa
            goos: darwin
            goarch: arm64
            tags: -tags=vtui_nococoa
            gcflags: ''
            vetflags: ''
          - label: linux/amd64 goffi_musl
            goos: linux
            goarch: amd64
            tags: -tags=goffi_musl
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std
            vetflags: ''
          - label: darwin/arm64
            goos: darwin
            goarch: arm64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: linux/amd64 vtui_noebiten,vtui_nogogpu
            goos: linux
            goarch: amd64
            tags: -tags=vtui_noebiten,vtui_nogogpu
            gcflags: ''
            vetflags: ''
          - label: windows/amd64 vtui_noebiten,vtui_nogogpu
            goos: windows
            goarch: amd64
            tags: -tags=vtui_noebiten,vtui_nogogpu
            gcflags: ''
            vetflags: ''
          - label: freebsd/amd64
            goos: freebsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
            vetflags: ''
          - label: openbsd/amd64
            goos: openbsd
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: netbsd/amd64
            goos: netbsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
            vetflags: ''
          - label: dragonfly/amd64
            goos: dragonfly
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: illumos/amd64
            goos: illumos
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: solaris/amd64
            goos: solaris
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # proxy.golang.org sometimes drops a module download with a stream
      # error (14-10-2026: Build (solaris/amd64) turned main red on it), which
      # says nothing about the code. Fetch modules with retries up front so the
      # real build or test step only ever sees a warm cache.
      - name: Download modules
        run: for i in 1 2 3 4; do go mod download && exit 0; sleep $((i * 10)); done; exit 1

      # f4's static and musl configurations, along with its target platforms,
      # make these downstream settings part of vtui's supported surface even
      # though vtui does not select them itself.
      - name: Vet
        run: go vet ${{ matrix.vetflags }} ${{ matrix.tags }} ${{ matrix.gcflags }} ./...
  cocoa:
    # The Cocoa backend end to end, on real macOS: cmd/cocoa-smoke opens the
    # window, sends it keys, clicks, a drag, wheel notches and a resize,
    # checks that each reached the application and that the frame handed to
    # Core Animation shows the answer, then closes the window. report.txt,
    # the frames it read back and screenshots of the window are uploaded
    # for a person to look at.
    name: Cocoa (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: darwin/arm64, arch: arm64 }
          - { os: macos-15-intel, target: darwin/amd64, arch: amd64 }
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build
        run: go build -o cocoa-smoke ./cmd/cocoa-smoke

      - name: Run
        env:
          VTUI_DEBUG: cocoa-smoke-out/debug.log
        run: |
          mkdir -p cocoa-smoke-out
          ./cocoa-smoke -out cocoa-smoke-out -timeout 3m

      - name: Summary
        if: always()
        run: |
          if [ -f cocoa-smoke-out/report.txt ]; then
            {
              echo "### Cocoa smoke test, ${{ matrix.target }}"
              echo '```'
              cat cocoa-smoke-out/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocoa-smoke-darwin-${{ matrix.arch }}
          path: cocoa-smoke-out
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # id-token: write lets codecov-action mint an OIDC token and upload
    # without a CODECOV_TOKEN secret (see the Codecov step below).
    permissions:
      id-token: write
      contents: read
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 30
      # Per-file numbers for the fleet (unxed/lunobot, LUNOBOT.md § 7.4):
      # https://api.codecov.io/api/v2/gh/unxed/repos/vtui/report/
      # There is no CODECOV_TOKEN secret, so the upload authenticates with
      # OIDC (id-token above). That works for main and same-repo pull
      # requests (the lunobot trains), not for forks; a failed upload never
      # turns the run red -- coverage is a report here, not a gate.
      - name: Upload coverage to Codecov
        if: hashFiles('coverage.out') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
